<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
   <link href="https://unpkg.com/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
  
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <form onsubmit="weatherInpSubmit(event)" class="search-box">
        <i class="bx bxs-map" style="color: #fff;; padding:0;"></i>
        <input type="text" id="weather-inp" placeholder="Enter Your City..." required />
        <button class="bx bx-search"></button>
      </form>
      <div class="weather-box">
        <div class="box">
            <div class="info-wather">
                <div class="weather">
                    <img src="" id="weather-img">
                    <p class="temperature"></p>
                    <p class="description"></p>
                </div>
            </div>
        </div>
      </div>
      <div class="weather-details">
        <div class="humidity">
          <i class="bx bx-water" style="color:#fff;"></i>
      <div class="text media-text1">
        <div class="info-humidity">
        <span id="humidity"></span>
        </div>
      <p class="humidity-p">Humidity</p>
      </div>
      </div>
    <div class="wind">
        <div class="humidity wind1">
          <i class="bx bx-wind " style="color: #ffffff;"></i> 
      <div class="text">
        <div class="info-wind">
        <span id="wind"></span>
       </div>
        <p class="wind-p">wind Speed</p>
      </div>
      </div>
    </div>
    </div>
    <div class="not-found">
      <div class="box">
        <img src="./error.png" class="not-found-img">
      </div>
    </div>
    </div>
      <script src="https://cdn.jsdelivr.net/npm/axios@1.17.0/dist/axios.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
